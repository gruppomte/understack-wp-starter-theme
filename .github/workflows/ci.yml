name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:

permissions:
  contents: read

jobs:
  php:
    name: PHP lint and analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - uses: ramsey/composer-install@v3
      - run: composer validate --strict --no-check-publish
      - run: composer lint
      - run: composer analyse
      - run: composer test:unit

  assets:
    name: Build and lint assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          composer-options: '--no-dev'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint:js
      - run: npm run format:check
      - run: npm run build
      - run: node scripts/check.mjs --no-lint --no-wp
      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: public/build
          include-hidden-files: true
          retention-days: 7

  e2e:
    name: End-to-end (WordPress Playground)
    runs-on: ubuntu-latest
    needs: [php, assets]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          composer-options: '--no-dev'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: build
          path: public/build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
